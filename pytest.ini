[pytest]
# Repo root on sys.path so `import coach` and `import interview_app.*` resolve
# no matter which directory you invoke pytest from (previously tests only ran
# from the repo root; running inside interview_app/ failed to import `coach`).
pythonpath = .

# Default target when you run bare `pytest`. Explicit paths/args still override
# this (e.g. `pytest path/to/other_test.py`).
testpaths = interview_app/tests

# Quiet, informative failures.
addopts = -q -ra
