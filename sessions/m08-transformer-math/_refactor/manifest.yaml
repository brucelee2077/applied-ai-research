    out_of_scope:
    - topic: the full per-operation flop table for every layer type
      reason: the day's whole value is that one line of multiplication replaces the table, and the shapes
        it depends on are day-02 material
    - topic: the arithmetic of the embedding and de-embedding layers including the vocabulary softmax
      reason: the source papers exclude embeddings from their own parameter count and the term is well
        under one percent, smaller than the rule's own ten percent wobble
    - topic: the arithmetic the optimizer itself performs
      reason: it happens once per update step rather than once per token, so against six times parameters
        times tokens it is a rounding error
    - topic: the arithmetic of layer normalisation, the activation bend, biases and residual adds
      reason: these are the sub-leading terms the source papers explicitly omit, and including them triples
        the vocabulary load for a change smaller than the stated error
    - topic: how fp8 or int8 change what counts as one step of arithmetic
      reason: lower precision changes how fast steps retire and how many bytes a number takes, not how
        many operations the model performs
    - topic: flash attention and its tiling
      reason: it changes how much data moves, not how many operations run, so it cannot change this day's
        number at all
    - topic: converting chip-hours into dollars
      reason: hours-to-dollars needs a rental price that changes every few months and would date the lesson;
        if added, it must be a price the learner types in, never a number baked into the prose
    - topic: comparing specific accelerators against each other
      reason: the method is a single division that works for any chip, and a comparison table dates quickly
    - topic: fine-tuning and adapter compute
      reason: it is the same rule with a smaller token count or fewer unfrozen parameters, and which parameters
        are frozen needs a module the reader has not reached
