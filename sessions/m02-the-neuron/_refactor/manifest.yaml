      - {topic: NeuralNetwork class walkthrough / 'Building a Complete Training System' / method-by-method reference, reason: "a code tour of the notebook's own multi-layer class; day-06 deliberately exposes the five loop lines by hand on ONE neuron, and the class-shaped version arrives with the MLP module"}
