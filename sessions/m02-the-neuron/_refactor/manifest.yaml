# -----------------------------------------------------------------------------
# COVERAGE  (V9 advisory coverage_gate — per-day notebook-yardstick curation)
# -----------------------------------------------------------------------------
# Read by sessions/_compiler/gates/coverage_gate.py. The gate compares the
# compiled lesson to its notebook yardstick's topic checklist; a topic the
# notebook teaches but the lesson does not is a GAP — UNLESS it is recorded here
# as `deferred` (taught on another day) or `out_of_scope` (not this curriculum's
# concern). Recording legitimate curation here clears the advisory flag next run.
# `covers` is the author-declared checklist (used when front-matter has no
# coverage_topics); it doubles as documentation of what the day is meant to teach.
coverage:
  day-02-activations:
    notebook_yardstick: 00-neural-networks/fundamentals/03_activation_functions.ipynb
    # SKILL-DRAFTED from domain knowledge (frontier-curriculum-architect Coverage Spec
    # Rule), NOT copied from the notebook. The notebook is the held-out TEST
    # (coverage_gate check B + coverage_judge). covers items may carry keyword
    # synonyms for robust tier-1 matching. Redrafted 2026-07-14 after the notebook
    # test + LLM judge surfaced two real skill gaps: Leaky ReLU (remedy for the
    # dead-ReLU failure we teach — failure->remedy rule) and slope/derivative
    # intuition (the saturation argument depends on it).
    covers:
      - non-linearity
      - linear collapse
      - {topic: step function, keywords: [step function, on off switch, binary activation, heaviside]}  # historical ancestor
      - relu
      - sigmoid
      - tanh
      - {topic: leaky relu, keywords: [leaky relu, small leak]}    # remedy for dead relu (failure->remedy)
      - {topic: dead relu, keywords: [dead relu, dying relu]}
      - {topic: sparse activation, keywords: [sparse, turns off many neurons]}  # first-order ReLU property (taught in the trade-off)
      - saturation
      - vanishing gradient
      - {topic: slope, keywords: [slope, steep, how steep]}        # slope-at-a-point intuition (derivative preview)
      - xor
    deferred:
      softmax: day-04-loss                 # cross-entropy day owns softmax
      weight initialization: day-05-gradients-backprop  # zero-init symmetry + small-random remedy are taught with the gradients day
      temperature: m05a                    # softmax temperature is a sampling/attention concern
      derivative: day-05-gradients-backprop  # formal derivatives + backprop; slope INTUITION previewed on D2
      output-layer activation choices: day-04-loss  # softmax / sigmoid-binary / sigmoid-multilabel / linear-regression taxonomy
      lstm gates: rnn-and-sequence-models  # sigmoid/tanh gates are an RNN-module application, not a D2 activation concept
    out_of_scope:
      - {topic: prelu, reason: "named sub-variant of Leaky ReLU (notebook §5 'Variants to Know'); not a distinct beginner concept"}
      - {topic: elu,   reason: "named sub-variant (smooth negative branch); the smooth-remedy family is covered via GELU/SwiGLU mention, not taught standalone"}

  day-03-layers-forward-pass:
    notebook_yardstick: 00-neural-networks/fundamentals/05_forward_propagation.ipynb
    # SKILL-DRAFTED (frontier-curriculum-architect Coverage Spec Rule). Rebuilt into the V9
    # concept structure 2026-07-20 with the Visualize-the-Build-Up rule (every heavy build-up
    # carries its own build-up visual). spine "assembly line". quest_id wf2-d03-forward (frozen).
    covers:
      - {topic: layer as parallel neurons, keywords: [layer, row of neurons, parallel neurons, same input]}
      - {topic: weight matrix W, keywords: [weight matrix, one row per neuron, grid of weights]}
      - {topic: "z = W x + b", keywords: [W x + b, weighted sum, matrix times input, one move]}
      - {topic: elementwise activation, keywords: [activation, elementwise, bend per neuron]}
      - {topic: hidden vs output layer, keywords: [hidden layer, output layer]}
      - {topic: forward pass, keywords: [forward pass, one trip, layer to layer, down the line]}
      - {topic: shape matching, keywords: [shape, dimension, columns equal inputs, shape mismatch]}   # failure->remedy: track shapes
      - {topic: linear collapse without activation, keywords: [collapse, no bend, fold into one]}       # failure->remedy: activation between layers
      - {topic: width and depth, keywords: [width, depth, bigger network]}
      - {topic: capability limit forward pass does not learn, keywords: [does not learn, only computes, no weight update]}
    deferred:
      loss: day-04-loss
      backpropagation: day-05-gradients-backprop
      softmax: day-04-loss                        # cross-entropy day owns softmax
      output-layer activation choices: day-04-loss
      weight initialization: day-05-gradients-backprop
    out_of_scope:
      - {topic: convolutional/recurrent/attention layers, reason: "specialized layer types; this day teaches the dense/fully-connected layer only"}
      - {topic: batching mechanics, reason: "a single input vector keeps the shape story clear; batching is a later performance/training detail"}
      - {topic: universal approximation theorem proof, reason: "the depth+nonlinearity intuition is taught; the formal proof is Layer-2 interview depth"}

  day-04-loss:
    notebook_yardstick: 00-neural-networks/fundamentals/06_loss_functions.ipynb
    # SKILL-DRAFTED. Rebuilt into V9 2026-07-20. This day OWNS softmax + the output-layer
    # taxonomy (deferred here from day-02) and the term "logits". IMPORTANT: a blind draft
    # tends to defer softmax/categorical-CE to a nonexistent "later classification day" — they
    # live HERE (topic C13), so they are in COVERS, not deferred. Every heavy build-up carries
    # its own build-up visual (predict-then-run demos + bar/curve SVGs). spine "golf score".
    # quest_id wf3-d01-loss (frozen).
    covers:
      - {topic: loss function is one number, keywords: [loss, one number, how wrong, lower is better, scorecard]}
      - {topic: why smooth not accuracy, keywords: [smooth, differentiable, accuracy gives no hint, slope, counting mistakes]}  # historical ancestor: 0/1 error
      - {topic: MSE and why squared, keywords: [mse, mean squared error, squared, big misses hurt]}
      - {topic: MAE outlier remedy, keywords: [mae, mean absolute error, outlier, wild point]}          # failure(outlier dominates MSE)->remedy MAE
      - {topic: binary cross-entropy, keywords: [cross-entropy, log loss, bce, -log correct prob, confident wrong]}
      - {topic: softmax multi-class, keywords: [softmax, sum to 1, more than two, probabilities, pizza]}
      - {topic: categorical cross-entropy, keywords: [categorical cross-entropy, cce, one of many classes]}
      - {topic: logits, keywords: [logits, raw scores, before softmax]}
      - {topic: loss is a mean over the batch, keywords: [average, mean over examples, dataset]}
      - {topic: MSE stalls on a sigmoid output, keywords: [mse stalls, slow, saturated slope]}           # failure->remedy: use cross-entropy
      - {topic: cross-entropy log(0) blow-up, keywords: [log 0, infinity, blow up, nan]}                 # failure->remedy: epsilon clip
      - {topic: capability limit loss judges does not fix, keywords: [judges not fix, does not update weights, tomorrow]}
    deferred:
      gradient descent: day-05-gradients-backprop
      backpropagation: day-05-gradients-backprop
      learning rate: day-08-learning-rate
      regularization: day-09-train-val-test   # L2/weight-decay + dropout live with the split/overfitting day; day-06 teaches only EARLY STOPPING
      overfitting vs generalization: day-09-train-val-test
    out_of_scope:
      - {topic: hinge/KL/focal/contrastive losses, reason: "specialized losses; MSE + cross-entropy suffice for a first loss lesson and none is a remedy for a failure taught here"}
      - {topic: maximum-likelihood derivation of cross-entropy, reason: "the information-theory origin is Layer-2 interview depth"}
      - {topic: log-sum-exp / from-logits numerical trick, reason: "production implementation detail; the beginner only needs 'log(0) is a problem and libraries handle it'"}

  day-06-training-loop:
    notebook_yardstick: 00-neural-networks/fundamentals/08_training_loop.ipynb
    # SKILL-DRAFTED (frontier-curriculum-architect Coverage Spec Rule). Added 2026-07-25 —
    # this block was MISSING, which left day-02/03 pointing "weight initialization" and
    # day-04 pointing "regularization" at a day that teaches neither (init lives on
    # day-05; L2/dropout on day-09). Those pointers are now repaired. The front-matter
    # coverage_topics in source.md is the authoritative spec for check A and OVERRIDES
    # `covers` below; `covers` documents the same 23 topics for readers of this file.
    # spine "free-throw". quest_id wf3-d03-training-loop (frozen).
    covers:
      - {topic: the four-phase loop, keywords: [four steps, forward pass, loss, backward pass, update, over and over]}
      - {topic: forward pass phase, keywords: [make a guess, weighted sum, prediction]}
      - {topic: loss phase, keywords: [how wrong, one number, loss]}
      - {topic: backward pass phase, keywords: [gradient, which way, backpropagation, blame]}
      - {topic: update phase, keywords: [the update, nudge the aim, shift each weight, new weight]}
      - {topic: minus sign goes downhill, keywords: [minus sign, opposite way, subtract]}
      - {topic: learning rate step size, keywords: [learning rate, step size, how big a step]}
      - {topic: epoch vs iteration, keywords: [epoch, one full pass, iteration, one step, one update]}
      - {topic: loss curve, keywords: [loss curve, plot the loss, goes down, watch it fall]}
      - {topic: convergence, keywords: [convergence, flattens out, stops improving, levels off]}
      - {topic: perceptron ancestor, keywords: [perceptron, rosenblatt, only on mistakes, fixed rule, crude ancestor]}   # historical ancestor
      - {topic: lr too high failure, keywords: [too high, overshoot, diverges, blows up, nan]}                 # failure->remedy: lower lr / decay
      - {topic: lr scheduling decay remedy, keywords: [learning-rate schedule, decay, shrink the learning rate, smaller steps later]}
      - {topic: lr too low failure, keywords: [too low, crawls, barely moves, too tiny]}                       # failure->remedy: raise lr
      - {topic: zero grad failure, keywords: [reset the gradients, gradients pile up, accumulate, forget to reset]}
      - {topic: zero grad remedy, keywords: [zero the gradients, reset the gradients each step, clear the gradients]}
      - {topic: shuffle failure, keywords: [same fixed order, fixed order, biased by that order, never shuffling]}
      - {topic: shuffle remedy, keywords: [shuffle the data, reshuffle each epoch, mix up the order]}
      - {topic: too few epochs underfit, keywords: [too few epochs, stopping too early, still high, underfit, train longer]}
      - {topic: overfitting from over-training, keywords: [memorizes, overfitting, train too long, validation loss rises]}
      - {topic: early stopping remedy, keywords: [early stopping, stop when validation stops improving, held-out]}
      - {topic: capability limit xor, keywords: [xor, non-linearly separable, more iterations never, plateaus above zero, single neuron cannot]}
      - {topic: local minimum plateau, keywords: [local minimum, plateau, non-convex, not the global best]}
    deferred:
      learning-rate search procedure: day-08-learning-rate   # sweeping lr by factors of ten + reading each curve; day-06 only states lr's role + its two failures
      learning-rate schedule shapes: day-08-learning-rate    # day-06 NAMES decay as the remedy; the shapes of the shrink are day-08's job
      momentum and adaptive optimizers: day-07-optimizers    # smarter Step 4 (Momentum / RMSProp / Adam) and their update equations
