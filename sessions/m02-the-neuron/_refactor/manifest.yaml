      train / validation / test split mechanics: day-09-train-val-test  # day-06 uses a held-out slice only as the early-stopping alarm
      L2 / weight decay and dropout: day-09-train-val-test   # the OTHER remedies for overfitting; day-06 teaches early stopping
      leakage and cross-validation: day-09-train-val-test
      weight initialization defaults (He / Xavier): m04-first-model-mlp  # zero-init symmetry is on day-05; the named fan-in schemes need layers
      input standardization / feature scaling: m04-first-model-mlp  # the long-thin-canyon failure and its z-score remedy need multi-feature data
      backpropagation through multiple layers: m04-first-model-mlp  # day-06 receives the single-neuron gradient ready-made
      autograd / framework training loops: m04-first-model-mlp      # what loss.backward() builds, and .fit()-style loops
      gradient clipping by global norm: m04-first-model-mlp
      numerical gradient checking + overfit-a-single-batch debug: m04-first-model-mlp
      curved / circles datasets needing a hidden layer: m04-first-model-mlp
      vectorized mini-batching, DataLoader, mixed precision, distributed training: m16a-m17-systems
    out_of_scope:
      - {topic: notebook scaffolding headings, reason: "'What We'll Learn', 'Key Insight', 'Key Definitions', 'Final Summary', 'Core Concepts', 'Best Practices', 'The Complete Picture', 'Final Challenge', 'What You've Mastered', 'Congratulations', 'Keep Learning', 'How to Avoid Them', 'Where Does the Training Loop Fit', 'Understanding Training Terminology', 'Simple Example' are the notebook's own section furniture, not concepts; the lesson carries the same content under its own headings"}
