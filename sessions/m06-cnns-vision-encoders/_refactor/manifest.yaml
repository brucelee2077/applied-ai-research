  spine: "seeing — a tiny stencil that slides, then a stack that turns pixels into meaning"

spine_map:
  day-01-convolution-pooling: "stencil — a tiny grid of weights slid across the image, reused everywhere; pooling shrinks and keeps what matters"
  day-02-output-dim-arithmetic: "tape-measure — predict the exact output grid a conv/pool produces"
  day-03-cnn-classifier: "funnel — stack conv+pool blocks that funnel pixels down to one label"
  day-04-batch-normalization: "thermostat — keep each layer's signal in a steady range so training is fast + stable"
  day-05-data-augmentation: "disguise — show the same photo in many disguises so the model learns the essence"
  day-06-transfer-learning-embeddings: "hand-me-down — borrow a network already trained to see, reuse its eyes"
  day-07-object-detection-intuition: "spotlight — not just what is in the image, but what and where"
  day-08-clip-contrastive: "matchmaker — teach images and words to live in one shared space"

