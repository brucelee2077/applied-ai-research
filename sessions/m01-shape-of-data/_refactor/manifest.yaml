# m01-shape-of-data — manifest
#
# Created solely to carry the bilingual contract. m01 was built before manifests
# existed, so it had none; without one, lang_parity_gate has nothing to read and
# all six days would pass inert even though they ARE bilingual — which is exactly
# the silence this field is meant to remove.
#
# m01 is REGION-MODE (mode: exemplar). Its Chinese is hand-written paired
# lang-en/lang-zh nodes inside verbatim `@@@ region` blocks, NOT `~~~zh` fences —
# a fence inside a region ships to the reader as literal text.
zh:
  langs: [en, zh]
  status: complete
  carrier: region-paired-spans
  require: all
  scope: 'm01 and m02 only, by user directive 2026-08-15.'
  analogy_exceptions: []
