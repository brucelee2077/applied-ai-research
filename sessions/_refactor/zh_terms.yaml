# =============================================================================
# zh_terms.yaml — technical terms allowed to stay in Latin script inside Chinese
# =============================================================================
# The agreed policy for the Chinese lessons: narration, analogies, headings, quiz
# and figure labels are Chinese; code, identifiers, formula symbols and technical
# TERMS stay English, glossed once on first use as e.g. attention（注意力）.
#
# Two reasons the terms stay English, both load-bearing:
#   * the same material serves Staff-level interview preparation, where the English
#     term is the thing the reader must be able to say;
#   * coverage_gate matches spec keywords against the page text, so an English term
#     inside Chinese prose keeps breadth checkable in both languages.
#
# This file is what lang_parity_gate check 5 uses to tell a DELIBERATE English term
# apart from a paragraph nobody got round to translating. Adding a word here is a
# curriculum decision: it says "a beginner should learn to read this in English".
# If a word is not a term of art, translate it instead of listing it.
#
# Lowercase. Matching is case-insensitive and word-wise.
terms:

  # --- the words every lesson needs to say ---------------------------------
  core:
    - model
    - token
