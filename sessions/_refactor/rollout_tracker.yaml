# =============================================================================
# Frontier Lab — Repo-Level Rollout Tracker
# =============================================================================
# Curriculum-wide source of truth for the first-principles refactor rollout.
# This is the project board that expands a one-line command
# ("Roll out sessions/m03-attention using the rollout tracker.") into the full
# goal loop, using the defaults below.
#
# Owner skill:  frontier-curriculum-architect  (Rollout Tracker Rule)
# Schema:       frontier_lab_refactor_skills_v7_4/ROLLOUT_TRACKER_SCHEMA.md
# QA gate:      frontier-refactor-qa           (tracker-state check)
#
# Rules of the road:
#   - This file is authoritative. Do not leave rollout state only in prose.
#   - Each module also keeps its own manifest: sessions/<module>/_refactor/manifest.yaml
#   - `status` here = FIRST-PRINCIPLES REFACTOR-rollout status (NOT original build
#     status). A module can be "built/shipped" yet still `not_started` for the
#     v7.x refactor loop because it has no _refactor/manifest.yaml yet.
#   - Module ORDER below = the curriculum rollout sequence (Parts A-D, then
#     Phases 1-9), which is also the numeric module order.
#   - Topic/title source of truth for every module is ROADMAP.md.
# =============================================================================

version: v8_proposed         # skills patched to v8 (source-first authoring) 2026-07-08; module-rollout mechanics remain v7.6-compatible (v8 is additive)
current_target: sessions/m03-attention   # seed = m02 (stabilized v7.6); rollout proceeds forward
default_mode: source_free
dynamic_workflow_assumed: true
last_updated: "2026-07-08"
bootstrapped: "2026-07-08"

# -----------------------------------------------------------------------------
# V8 AUTHORING SYSTEM  (PROPOSED / IN PROGRESS — spec + skills only; no rollout)
# -----------------------------------------------------------------------------
# v8 adds a SOURCE-FIRST authoring layer: author sessions/<module>/day-XX/source.md
# in reader-flow order; a compiler emits lesson.html and owns the shell/JS/invariants.
# The notebook is a reader-flow YARDSTICK, not a build dependency — future modules
# (JAX, Scaling Laws) are authored WITHOUT notebooks via Reference/First-Principles mode.
v8_authoring_system:
  status: in_progress          # proposed -> in_progress: Phase A (spec) + Phase B (compiler pilot) done
  date: "2026-07-08"
  skills_patched: true          # installed frontier-* patched (additive) + v8 mirror byte-identical
  compiler_built: true          # sessions/_compiler/compile_lesson.py — MVP works on the m02-day-01 pilot
  compiler: "sessions/_compiler/compile_lesson.py"
  modules_sourced: ["m02-the-neuron/day-01-single-neuron"]   # first day authored source-first
  phase_b_pilot:
    status: completed
    day: "m02-the-neuron/day-01-single-neuron"
    source: "sessions/m02-the-neuron/day-01-single-neuron/source.md"
    donor: "sessions/_compiler/shells/m02-day-01.donor"
    report: "sessions/_refactor/v8_phase_b_m02_day1_pilot_report.md"
    result: "PASS — deterministic; shell byte-identical (CSS+JS engine); reader-flow + shell-invariant gates pass; lesson_audit 9 OK, nav PASS, staff-lens 9/9 gap 0; smoother than v7.6 HTML on the first screen and competitive with the notebook"
  reports:
    - sessions/_refactor/v8_exemplar_distillation_report.md
    - sessions/_refactor/v8_source_first_authoring_plan.md
    - sessions/_refactor/v8_phase_b_m02_day1_pilot_report.md
  authoring_modes:
    - {id: exemplar,         when: "strong companion notebook", notebook_smoothness_gate: applies, examples: ["m02 (pilot)"]}
    - {id: reference,        when: "papers/docs, no notebook",   notebook_smoothness_gate: "N/A (skipped, never failed)", examples: ["m07-thinking-in-jax (JAX docs)", "m10a-scaling-laws / m13 (arXiv 2001.08361, 2203.15556)"]}
    - {id: first_principles, when: "no strong ref, no notebook",  notebook_smoothness_gate: "N/A (skipped, never failed)", examples: ["synthesis/framing modules"]}
  gates_added:
    - reader_flow
    - notebook_smoothness_pilot_only
    - no_notebook_authoring
    - shell_invariant
    - staff_depth
  exemplar_yardstick: 00-neural-networks/fundamentals/01_what_is_a_neural_network.ipynb  # style/flow reference only
  no_notebook_rule: "A module without a notebook is not blocked and is not lower quality. Notebook Smoothness Gate is skipped (N/A) for reference/first-principles modules; Reader Flow + Staff Depth + Shell Invariant + Visual/Evidence + Artifact gates still run."
  phasing: "A(spec — DONE) → B(compiler MVP + m02-day-01 pilot — DONE) → C(gates as code) → D(pilot: source all 9 m02 days, run Notebook Smoothness Gate) → E(first no-notebook rollout: m07 or m10a in Reference mode)"
  note: "IN PROGRESS. Phase A (spec) + Phase B (compiler MVP, m02-day-01 sourced+compiled) done. No module status changed; m03 untouched. Day 02-09 not yet sourced."

# -----------------------------------------------------------------------------
# GLOBAL CONSTRAINTS  (apply to every module rollout — never violate)
# -----------------------------------------------------------------------------
global_constraints:
  do_not_modify:
    - shared shell files (sidebar + Appearance switcher, 4 themes, dark default)
    - data-quest-id values (frozen per-module; e.g. m02 wf2-*/wf3-* prefixes)
    - navigation (prev/next chain, hub MODULES array, data-target links)
    - localStorage keys (frontier-lesson:<qid>, frontier-theme)
    - quiz mechanics (playground >=3 gate + quiz-answered gate; q:4 o:16)
    - BUILD / DEMOS / QS completion behavior and .fin completion banners
  do_not_do:
    - broad prose polish
    - read old notebooks or prior courseware unless a held-out eval is explicitly requested
    - refactor a module that is not the current_target
    - edit lesson files during a QA / eval / manifest-only loop (report-only)
  language_preference: "English-primary, light-touch bilingual (Chinese only when truly necessary). User preference overrides the frontier skills' bilingual default."
  sanctioned_designs:   # repo-wide; explicitly NOT defects — do not re-flag as P0
    - id: guided_stub_experiment_py
      note: "Per-day experiment.py is a deliberate ~5-line guided stub (learner produces it), not a filled reference solution. Not a defect."
    - id: dead_experiment_lab
      note: "/frontier-experiment-lab is uninstalled but referenced in every Produce Option-B + stub (~243 files). Curriculum-wide P1. Fix globally when the skill is reinstated; never fix per-module."
    - id: static_svg_structural
      note: "Static SVGs are acceptable for STRUCTURAL diagrams. Only BEHAVIORAL concepts (a changing curve/derivative/boundary/gradient) require plotted or live-recomputed evidence (skill patch S1)."
    - id: staff_lens_render_benign
      note: "staff_lens_audit.js reporting render:BROKEN / secs:0 is a known-benign .sec vs .module-section selector mismatch, not a regression."

# -----------------------------------------------------------------------------
# DEFAULT SUCCESS GATES  (the goal loop for each module derives from these)
# -----------------------------------------------------------------------------
default_success_gates:
  p0_count: 0
  manifest_status:
    - pass
    - pass_with_p1
  required_gates:
    - coverage_traceability
    - coach_voice
    - foundation_framing_when_applicable
    - function_family
    - visual_evidence
    - artifact
    - anchor_consistency
  required_checks:
    - lesson_audit                 # python3 sessions/lesson_audit.py <module>
    - nav_audit_if_available       # python3 sessions/nav_audit.py
    - jsdom_or_node_if_available   # node --check on inline scripts; jsdom render if available
    - staff_lens_audit_if_available # node sessions/staff_lens_audit.js <module>

