  status: in_progress          # proposed -> in_progress: Phase A (spec) + Phase B (compiler pilot) done
  date: "2026-07-08"
  skills_patched: true          # installed frontier-* patched (additive) + v8 mirror byte-identical
  compiler_built: true          # sessions/_compiler/compile_lesson.py — MVP works on the m02-day-01 pilot
  compiler_hardened: true       # Phase C: shared v8lib.py + standalone gate modules + typed widget blocks
  compiler: "sessions/_compiler/compile_lesson.py (orchestrator) + v8lib.py (core) + gates/{reader_flow,shell_invariant,notebook_smoothness}_gate.py + extract_source.py"
  modules_sourced: ["m02-the-neuron: ALL 9 days (day-01 clean typed-block; day-02..09 verbatim/migration mode)"]
  phase_b_pilot:
    status: completed
    day: "m02-the-neuron/day-01-single-neuron"
    source: "sessions/m02-the-neuron/day-01-single-neuron/source.md"
    donor: "sessions/_compiler/shells/m02-day-01.donor"
    report: "sessions/_refactor/v8_phase_b_m02_day1_pilot_report.md"
    result: "PASS — deterministic; shell byte-identical (CSS+JS engine); reader-flow + shell-invariant gates pass; lesson_audit 9 OK, nav PASS, staff-lens 9/9 gap 0; smoother than v7.6 HTML on the first screen and competitive with the notebook"
  phase_c_hardening:
    status: completed
    date: "2026-07-08"
    report: "sessions/_refactor/v8_phase_c_compiler_hardening_report.md"
    extracted:
      - "sessions/_compiler/v8lib.py (shared core: parsing, markdown-lite, typed widgets, region compile)"
      - "sessions/_compiler/gates/reader_flow_gate.py (standalone CLI + importable run())"
      - "sessions/_compiler/gates/shell_invariant_gate.py (standalone CLI + importable run(); optional donor shell-identity check)"
