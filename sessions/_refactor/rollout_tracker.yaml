# -----------------------------------------------------------------------------
# GLOBAL CONSTRAINTS  (apply to every module rollout — never violate)
# -----------------------------------------------------------------------------
global_constraints:
  do_not_modify:
    - shared shell files (sidebar + Appearance switcher, 4 themes, dark default)
    - data-quest-id values (frozen per-module; e.g. m02 wf2-*/wf3-* prefixes)
    - navigation (prev/next chain, hub MODULES array, data-target links)
    - localStorage keys (frontier-lesson:<qid>, frontier-theme)
    - quiz mechanics (playground >=3 gate + quiz-answered gate; q:4 o:16)
    - BUILD / DEMOS / QS completion behavior and .fin completion banners
  do_not_do:
    - broad prose polish
    - read old notebooks or prior courseware unless a held-out eval is explicitly requested
    - refactor a module that is not the current_target
    - edit lesson files during a QA / eval / manifest-only loop (report-only)
  language_preference: "English-primary, light-touch bilingual (Chinese only when truly necessary). User preference overrides the frontier skills' bilingual default."
  sanctioned_designs:   # repo-wide; explicitly NOT defects — do not re-flag as P0
    - id: dead_experiment_lab
      note: "/frontier-experiment-lab is uninstalled but referenced in every Produce Option-B + stub (~243 files). Curriculum-wide P1. Fix globally when the skill is reinstated; never fix per-module."
    - id: static_svg_structural
      note: "Static SVGs are acceptable for STRUCTURAL diagrams. Only BEHAVIORAL concepts (a changing curve/derivative/boundary/gradient) require plotted or live-recomputed evidence (skill patch S1)."
    - id: staff_lens_render_benign
      note: "staff_lens_audit.js reporting render:BROKEN / secs:0 is a known-benign .sec vs .module-section selector mismatch, not a regression."

# -----------------------------------------------------------------------------
# DEFAULT SUCCESS GATES  (the goal loop for each module derives from these)
# -----------------------------------------------------------------------------
default_success_gates:
  p0_count: 0
  manifest_status:
    - pass
    - pass_with_p1
  required_gates:
    - coverage_traceability
    - coach_voice
    - foundation_framing_when_applicable
    - function_family
    - visual_evidence
    - artifact
    - anchor_consistency
  required_checks:
    - lesson_audit                 # python3 sessions/lesson_audit.py <module>
    - nav_audit_if_available       # python3 sessions/nav_audit.py
    - jsdom_or_node_if_available   # node --check on inline scripts; jsdom render if available
    - staff_lens_audit_if_available # node sessions/staff_lens_audit.js <module>

