    reusable_for_d2_d9: "yes — v8lib + typed-block vocabulary + standalone gates are lesson-agnostic; each new day needs only a source.md + a donor snapshot"
  phase_d_sourcing:
    status: completed
    date: "2026-07-09"
    report: "sessions/_refactor/v8_phase_d_sourcing_report.md"
    scope: "all 9 m02 days sourced + Notebook Smoothness Gate run across them"
    sourcing: "day-01 = clean typed-block (Phase B/C exemplar); day-02..09 = verbatim/migration mode via sessions/_compiler/extract_source.py (regions captured byte-for-byte; round-trip byte-identical to the shipped v7.6 lesson — ZERO content regression)"
    notebook_smoothness_gate: "PASS — 6 PASS (D1-D6, fundamentals notebooks 01/03/05/06/07/08), 3 N/A (D7-D9, no matching notebook -> skipped per No-Notebook rule), 0 FAIL"
    per_day: "all 9: Reader Flow Gate exit0 (D1 strict PASS; D2-09 informational-verbatim), Shell Invariant PASS (CSS+scripts byte-identical to donor), deterministic (compile twice -> identical)"
