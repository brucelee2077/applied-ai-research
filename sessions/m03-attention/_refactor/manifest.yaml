  day-01-embeddings:
    covers:
      - {topic: embedding is a word as a vector, keywords: [embedding, list of numbers, vector, profile card]}
      - {topic: embedding matrix lookup table, keywords: [lookup table, embedding matrix, one row per, token id]}
      - {topic: meaning as geometry, keywords: [close together, near each other, similar meaning, space]}
      - {topic: similarity via dot product or cosine, keywords: [dot product, cosine, how alike, distance]}
      - {topic: embeddings are learned, keywords: [learned, not hand]}
      - {topic: one-hot encoding ancestor, keywords: [one-hot, single 1, all zeros]}
      - {topic: out-of-vocabulary failure, keywords: [out-of-vocabulary, oov, never seen, unknown word]}
      - {topic: subword tokenization remedy, keywords: [subword, split into pieces, wordpiece, tokeniz]}
      - {topic: context-free limit, keywords: [same vector, regardless of, context-free, one meaning]}
    deferred:
      attention: day-02-qkv
      contextual embeddings: day-02-qkv
      query key value: day-02-qkv
      softmax: day-03-attention-scores
      positional encoding: day-05-positional
    out_of_scope:
      - {topic: word2vec/GloVe training algorithms, reason: "training-procedure detour; a first 'what is an embedding' lesson only needs that vectors are learned"}
      - {topic: BPE/WordPiece merge internals, reason: "the beginner needs the idea that rare words split into pieces, not the merge algorithm"}
  day-02-qkv:
    covers:
      - {topic: three roles from one embedding, keywords: [three roles, query, key, value]}
      - {topic: query is what a word looks for, keywords: [query, looking for]}
      - {topic: key is the name-tag advertised, keywords: [key, name-tag, advertise]}
      - {topic: value is the content shared, keywords: [value, content, share]}
      - {topic: learned projections QKV, keywords: [W_Q, W_K, W_V, projection, x @ W]}
      - {topic: why separate roles, keywords: [separate, different role]}
      # Moved up from `deferred` 2026-07-26: the V9 day-02 lesson now teaches the
      # whole single-word pipeline BY HAND end to end (c3-c6), so listing these as
      # deferred no longer described the module. day-03 keeps them as its covers
      # too — it redoes the same stations for every word at once, in matrix form
      # (Q@Kᵀ), plus masking and the additive-attention history.
      - {topic: attention score dot product, keywords: [dot product, attention score]}
      - {topic: scaling by sqrt d_k, keywords: [sqrt, "√d_k", scaled dot-product]}
      - {topic: softmax into attention weights, keywords: [softmax, attention weights, add up to 1]}
      - {topic: weighted sum of values, keywords: [weighted sum, blend]}
      - {topic: shapes and the d_k contract, keywords: [d_model, d_k, d_v, shape]}
      - {topic: self-attention same sequence, keywords: [self-attention, same sentence]}
    deferred:
      matrix form of the score grid: day-03-attention-scores
      masking mechanics: day-03-attention-scores
      full variance derivation of sqrt d_k: day-03-attention-scores
      multi-head: day-04-multihead
      positional encoding: day-05-positional
    out_of_scope:
      - {topic: flash-attention / kernel fusion, reason: "systems-level optimization far beyond a first QKV lesson"}
  day-03-attention-scores:
    covers:
      - {topic: dot-product match score, keywords: [dot product, match score, compare query to key]}
      - {topic: score matrix Q Kᵀ, keywords: [Q@K, score matrix, every word vs every]}
      - {topic: scale by sqrt d_k, keywords: [sqrt, scale, √d_k, divide]}
      - {topic: softmax attention budget, keywords: [softmax, budget, adds to 1, 100%]}
      - {topic: weighted blend of values, keywords: [weighted sum, blend, mix the values]}
      - {topic: full attention line, keywords: [softmax, "@V", full line]}
    deferred:
      multi-head: day-04-multihead
      positional encoding: day-05-positional
    out_of_scope:
      - {topic: flash-attention / sparse attention, reason: "efficiency variants beyond the core score→softmax→blend idea"}
  day-04-multihead:
    covers:
      - {topic: several parallel heads, keywords: [multiple heads, parallel, several meetings]}
      - {topic: each head a different relationship, keywords: [different thing, each head, another relationship]}
      - {topic: split dimensions d_k = d_model/h, keywords: [d_model, split, d_k, divide the width]}
      - {topic: concatenate heads, keywords: [concat, merge, join the heads]}
      - {topic: output projection W_O, keywords: [W_O, output projection, mix back]}
    deferred:
      positional encoding: day-05-positional
    out_of_scope:
      - {topic: grouped-query / multi-query attention, reason: "inference-efficiency variant; a first multi-head lesson teaches plain MHA"}
  day-05-positional:
    covers:
      - {topic: permutation invariance problem, keywords: [shuffle, same answer, order ignored, permutation]}
      - {topic: seat-number idea, keywords: [seat, position number, stamp]}
      - {topic: sinusoidal positional encoding, keywords: [sinusoidal, positional encoding, sine, added to]}
      - {topic: added to the embedding, keywords: [add to embedding, combined with]}
      - {topic: why order matters, keywords: [order matters, meaning changes]}
    deferred:
      rope: later/interview
      alibi: later/interview
    out_of_scope:
      - {topic: relative-position-bias math, reason: "RoPE/ALiBi are named as modern alternatives; their exact math is interview-depth"}

