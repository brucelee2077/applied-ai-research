# -----------------------------------------------------------------------------
# NARRATIVE SPINE  (module-wide; carried across all 5 days)
# -----------------------------------------------------------------------------
spine_map:
  frame: "Picture a meeting where every word is a person deciding who else in the room to listen to."
  day-01-embeddings: "Before the meeting, each word gets a PROFILE CARD of numbers (its embedding). Similar words get similar cards, so they sit near each other. A dot product reads how alike two cards are."
  day-02-qkv: "In the meeting, each word plays THREE roles from its one profile: a Query (what it's looking for), a Key (the name-tag it advertises), and a Value (the content it will share). Q=x@W_Q, K=x@W_K, V=x@W_V."
  day-03-attention-scores: "Each word compares its Query to everyone's Key (a dot product = a match score, Q@Kᵀ), scales by √d_k, then splits a fixed 100% attention budget with softmax, and blends everyone's Value by that budget. Full line: softmax(Q@Kᵀ/√d_k)@V."
  day-04-multihead: "One conversation isn't enough — run several parallel meetings (heads), each listening for a different thing, then merge their notes. d_k = d_model/h; Concat(head₁..head_h)@W_O."
  day-05-positional: "The meeting so far ignores WHO SPOKE WHEN — shuffle the words and the answer is unchanged (permutation-invariant). Fix: stamp each word with a seat number (sinusoidal positional encoding) so order carries meaning."

